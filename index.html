<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANDREV Audio</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./assets/andrev-mark.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="wordmark" aria-label="ANDREV">ANDREV</div>
      </header>

      <main>
        <div class="pickerTitle">Select an option</div>
        <section class="modePicker">
          <button class="modePick" id="modeVoiceBtn" type="button" aria-selected="false">Voice</button>
          <button class="modePick" id="modeTextBtn" type="button" aria-selected="false">Text</button>
        </section>

        <div class="statusLine" id="statusText" aria-live="polite"></div>

        <div id="voiceFlow" hidden>
          <div class="grid">
            <section class="card">
              <div class="cardHeader">
                <h2>Voice</h2>
                <div class="muted" id="audioMeta">No audio selected</div>
              </div>

              <div class="controls">
                <button class="btn primary" id="recordBtn" type="button">
                  <span class="btnIcon" aria-hidden="true">●</span>
                  <span id="recordBtnText">Record</span>
                </button>

                <button class="btn" id="uploadBtn" type="button">Upload audio</button>
                <input id="fileInput" class="srOnly" type="file" accept="audio/*" />
              </div>

              <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Drop audio here">
                <div class="dropTitle">Drop an audio file here</div>
                <div class="dropHint">or use Upload • Supported: audio/*</div>
              </div>

              <div class="preview">
                <audio id="audioPlayer" controls class="audio" preload="metadata"></audio>
              </div>

              <div class="row">
                <div class="badge" id="recordingBadge" aria-live="polite" hidden>
                  Recording
                  <span class="mono" id="recordingTimer">00:00</span>
                </div>
              </div>
            </section>

            <section class="card">
              <div class="cardHeader">
                <h2>Transcribed Voice</h2>
              </div>

              <label class="field">
                <div class="fieldLabel">Text</div>
                <textarea
                  id="voiceTranscriptText"
                  class="textbox mono"
                  placeholder="Transcription (then generated content) will appear here..."
                  spellcheck="false"
                ></textarea>
              </label>

              <div class="actions center">
                <button class="btn primary" id="voiceGenerateBtn" type="button" disabled>Generate</button>
              </div>
            </section>
          </div>
        </div>

        <div id="textFlow" hidden>
          <div class="grid oneCol">
            <section class="card">
              <div class="cardHeader">
                <h2>Text</h2>
              </div>

              <label class="field">
                <div class="fieldLabel">Input</div>
                <textarea
                  id="textInputText"
                  class="textbox"
                  placeholder="Write or paste your text here..."
                  spellcheck="true"
                ></textarea>
              </label>

              <div class="actions center">
                <button class="btn primary" id="textGenerateBtn" type="button" disabled>Generate</button>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
