<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANDREV Audio</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./assets/andrev-mark.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="wordmark" aria-label="ANDREV">ANDREV</div>
      </header>

      <main class="grid">
        <section class="card">
          <div class="cardHeader">
            <h2>Audio</h2>
            <div class="muted" id="audioMeta">No audio selected</div>
          </div>

          <div class="controls">
            <button class="btn primary" id="recordBtn" type="button">
              <span class="btnIcon" aria-hidden="true">●</span>
              <span id="recordBtnText">Record</span>
            </button>

            <button class="btn" id="uploadBtn" type="button">Upload audio</button>
            <input id="fileInput" class="srOnly" type="file" accept="audio/*" />
          </div>

          <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Drop audio here">
            <div class="dropTitle">Drop an audio file here</div>
            <div class="dropHint">or use Upload • Supported: audio/*</div>
          </div>

          <div class="preview">
            <audio id="audioPlayer" controls class="audio" preload="metadata"></audio>
          </div>

          <div class="row">
            <div class="badge" id="recordingBadge" aria-live="polite" hidden>
              Recording
              <span class="mono" id="recordingTimer">00:00</span>
            </div>
            <div class="muted" id="statusText" aria-live="polite"></div>
          </div>
        </section>

        <section class="card">
          <div class="cardHeader">
            <h2>Transcription</h2>
            <div class="muted">Shows the last transcription result</div>
          </div>

          <div class="actions">
            <button class="btn" id="transcribeBtn" type="button" disabled>Show transcription</button>
            <button class="btn" id="sendBtn" type="button" disabled>Send data to backend</button>
          </div>

          <textarea
            id="transcriptText"
            class="textbox mono"
            placeholder="Transcription will appear here..."
            spellcheck="false"
          ></textarea>
        </section>
      </main>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
